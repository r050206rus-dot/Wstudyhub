name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Поднимает локальный Postgres+Supabase в контейнере CI-раннера,
      # накатывает миграции из supabase/migrations и seed.sql, затем
      # прогоняет всё из supabase/tests/database через pg_prove.
      - name: Start Supabase (local) and run db tests
        run: |
          supabase start
          supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop

  lint-and-build-app:
    runs-on: ubuntu-latest
    # Появится в этапе 2, когда будет создан клиент (Vite+TS) в app/.
    if: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  deploy-staging:
    needs: [lint-and-test-db]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations to staging
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

  deploy-prod:
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # в GitHub включить required reviewers на это environment
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
